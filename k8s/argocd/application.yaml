apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dockerized-service
  namespace: argocd
  labels:
    app.kubernetes.io/name: dockerized-service
    app.kubernetes.io/part-of: dockerized-service-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ADITYAGUPTA112/Dockerized-Service-Architecture-Planning.git
    targetRevision: main
    path: k8s/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: dockerized-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
