apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dockerized-service.fullname" . }}-config
  labels:
    {{- include "dockerized-service.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dockerized-service.fullname" . }}-secret
  labels:
    {{- include "dockerized-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_MESSAGE: {{ .Values.secrets.secretMessage | quote }}
  USERNAME: {{ .Values.secrets.username | quote }}
  PASSWORD: {{ .Values.secrets.password | quote }}
