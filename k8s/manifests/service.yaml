apiVersion: v1
kind: Service
metadata:
  name: dockerized-service
  namespace: dockerized-service
  labels:
    app.kubernetes.io/name: dockerized-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: dockerized-service
