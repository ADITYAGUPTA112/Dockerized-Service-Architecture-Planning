apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dockerized-service

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.example.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - servicemonitor.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: dockerized-service-k8s
