apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dockerized-service-monitor
  namespace: dockerized-service
  labels:
    app.kubernetes.io/name: dockerized-service
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dockerized-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
