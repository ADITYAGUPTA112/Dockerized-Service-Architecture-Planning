services:
  # Official Jenkins Controller
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins-controller
    restart: unless-stopped
    privileged: false
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      DOCKER_HOST: tcp://docker-dind:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    volumes:
      - jenkins_data:/var/jenkins_home
      - docker_certs:/certs/client:ro
    networks:
      - jenkins-net
    depends_on:
      docker-dind:
        condition: service_healthy

  # Docker-in-Docker sidecar for safe container builds inside Jenkins
  docker-dind:
    image: docker:dind
    container_name: jenkins-docker-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - jenkins_data:/var/jenkins_home
      - docker_certs:/certs/client
    networks:
      - jenkins-net
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  jenkins_data:
  docker_certs:

networks:
  jenkins-net:
    driver: bridge
